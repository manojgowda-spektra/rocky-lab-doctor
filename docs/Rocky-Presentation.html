<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rocky — Presentation</title>
<!--
  Clean briefing deck. Fixed 1280×720 canvas scaled to fit the window (identical everywhere, never
  overflows). Present: F = full screen, → / Space / click-right = next, ← = back, N = speaker notes,
  Ctrl/Cmd+P = Save as PDF (one slide per page). Content is fact-verified; numbers set in monospace to
  echo Rocky's "verified receipts" identity. AI chat is off (new model pending) — noted honestly.
-->
<style>
  :root{
    --paper:#f6f8f7; --ink:#13201c; --dim:#54655f; --faint:#8fa39c;
    --accent:#0c7a68; --accent-2:#0a5f51; --wash:#0c7a6812; --line:#13201c1a; --line2:#13201c33;
    --real:#0c7a68; --sim:#3a6ea5; --mixed:#9a6b00; --brick:#b0442c;
    --sans:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0a0f0e;font-family:var(--sans);color:var(--ink);overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
  #wrap{width:1280px;height:720px;position:relative;transform:scale(var(--s,1));transform-origin:center}

  .slide{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;
    padding:52px 92px 44px;overflow:hidden}
  .slide.on{display:flex}
  @media (prefers-reduced-motion: no-preference){ .slide.on{animation:rise .4s cubic-bezier(.2,.7,.3,1)} }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* header + footer rails */
  .head{display:flex;align-items:center;gap:12px;flex:none;height:26px}
  .mark{font-weight:800;font-size:15px;letter-spacing:.02em}
  .mark span{color:var(--accent)}
  .head .sec{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .foot{display:flex;align-items:center;gap:12px;flex:none;height:24px;font-family:var(--mono);font-size:12px;color:var(--faint)}
  .foot .num{letter-spacing:.05em}
  .chip{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:6px;border:1px solid var(--line2)}
  .chip.REAL{color:var(--real);background:var(--wash);border-color:#0c7a6840}
  .chip.SIMULATED{color:var(--sim);background:#3a6ea512;border-color:#3a6ea540}
  .chip.MIXED{color:var(--mixed);background:#9a6b0012;border-color:#9a6b0040}
  .chip.NONE{visibility:hidden}

  .body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.06;max-width:24ch;text-wrap:balance}
  .sub{font-size:24px;color:var(--dim);line-height:1.45;max-width:52ch;margin-top:16px}
  .num{font-family:var(--mono);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}

  /* title / section / closing — centered rhythm */
  .slide.center .body{align-items:center;text-align:center}
  .slide.center .sub{max-width:56ch}
  .logo{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;font-size:46px;
    background:var(--wash);border:1px solid #0c7a6833;margin-bottom:26px}
  .slide.title h1{font-size:96px} .slide.section h1{font-size:88px;color:var(--accent)}
  .slide.closing h1{font-size:60px}

  /* three-jobs slide */
  .jobs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:8px}
  .job{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:26px 24px;background:#fff}
  .job .w{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .job h3{font-size:26px;font-weight:800;margin-bottom:8px}
  .job p{font-size:17px;color:var(--dim);line-height:1.45}

  /* story slide — calm vertical rhythm */
  .hat{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .hat .e{font-size:44px}
  .hat .n{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .analogy{font-size:22px;color:var(--dim);font-style:italic;line-height:1.4;max-width:60ch;margin:6px 0 26px;
    padding-left:16px;border-left:3px solid var(--line2)}
  .result{font-size:34px;font-weight:750;line-height:1.28;max-width:44ch;letter-spacing:-.01em}
  .does{font-size:18px;color:var(--faint);margin-top:18px;max-width:60ch;line-height:1.5}

  /* stat slide */
  .slide.stat .body{align-items:flex-start}
  .big{font-family:var(--mono);font-size:172px;font-weight:800;color:var(--accent);line-height:.9;letter-spacing:-.03em}
  .stat .lbl{font-size:26px;color:var(--dim);max-width:40ch;line-height:1.4;margin-top:16px}
  .twoup{display:flex;gap:96px}
  .twoup .big{font-size:118px}
  .twoup .lbl{font-size:20px;margin-top:10px}

  /* real vs simulated */
  .rs{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:6px}
  .rs .col{border:1px solid var(--line);border-radius:14px;padding:24px 26px;background:#fff}
  .rs .col.real{border-top:3px solid var(--real)} .rs .col.sim{border-top:3px solid var(--sim)}
  .rs h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
  .rs .col.real h3{color:var(--real)} .rs .col.sim h3{color:var(--sim)}
  .rs ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .rs li{font-size:17px;line-height:1.4;padding-left:20px;position:relative;color:var(--ink)}
  .rs li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:2px}
  .rs .col.real li::before{background:var(--real)} .rs .col.sim li::before{background:var(--sim)}

  /* chrome */
  #bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);z-index:30;width:0;transition:width .4s linear}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;font-family:var(--mono);font-size:11px;color:#ffffff66;z-index:30}
  /* always-visible navigation buttons */
  #nav{position:fixed;z-index:50;bottom:26px;right:28px;display:flex;gap:12px}
  #nav button{cursor:pointer;font-family:var(--sans);font-size:16px;font-weight:700;border:none;border-radius:10px;
    padding:12px 20px;color:#04241f;background:var(--accent);box-shadow:0 8px 24px #0006}
  #nav button.ghost{background:#ffffff;color:var(--ink);border:1px solid #ffffff}
  #nav button:hover{filter:brightness(1.06)}
  #nav button:disabled{opacity:.4;cursor:default;filter:none}
  #nav button:focus-visible{outline:3px solid #7df0dd;outline-offset:2px}
  #note{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;background:#0b1512f2;color:#eaf2ee;
    padding:22px 8vw;font-size:16px;line-height:1.55;border-top:2px solid var(--accent)}
  #note.on{display:block}
  #note .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px}

  @media print{
    @page{size:1280px 720px;margin:0}
    body{background:#fff;overflow:visible}
    #stage{position:static;display:block}
    #wrap{transform:none;width:1280px;height:720px}
    .slide{display:flex!important;position:relative;page-break-after:always}
    #bar,#hint,#note{display:none!important}
  }
</style>
</head>
<body>
<div id="stage"><div id="wrap"></div></div>
<div id="bar"></div>
<div id="hint">← →  ·  F full screen  ·  N notes  ·  Ctrl/Cmd+P → PDF</div>
<div id="nav"><button id="prev" class="ghost" aria-label="Previous slide">‹ Back</button><button id="next" aria-label="Next slide">Next ›</button></div>
<div id="note"></div>
<script>
const S=[
 {kind:"title", prov:"NONE",
  logo:"🤖", eyebrow:"Company briefing", h1:"Rocky",
  sub:"The reliability layer for hands-on cloud labs.  One engine · several hats · three jobs.",
  note:"This is Rocky — a quality team that never sleeps, watching over our hands-on cloud labs. In a few minutes: the problem, and the real results it has already found."},

 {kind:"content", sec:"The problem", prov:"NONE",
  h1:"It's 2 a.m. The lab is broken. The learner blames themselves — and quits.",
  sub:"We only find out later, from support tickets. The guide stays broken for the next person too.",
  note:"Picture a learner at 2 a.m. doing exactly what the guide says, and it fails. They assume it's their fault and give up — and nobody on our side hears about it. That silent failure is what Rocky catches."},

 {kind:"jobs", sec:"The idea", prov:"NONE", h1:"One Rocky. Three simple jobs.",
  jobs:[["Find","Read every guide and watch every result to catch what's broken."],
        ["Fix","Draft the repair, a human approves, prove it worked, block it from returning."],
        ["Help","Stand with the learner in the moment — answers from evidence, never guesses."]],
  note:"Everything Rocky does is one of three jobs: Find, Fix, Help. It's one system wearing different hats for each. Hold those three words and the rest is easy."},

 {kind:"section", sec:"Job 1", prov:"NONE", eyebrow:"Job 1 of 3", h1:"Find",
  sub:"Catch what's broken before a learner does.",
  note:"First job: finding problems, by reading our guides and watching real results."},

 {kind:"story", sec:"Find", prov:"REAL", e:"🩺", hat:"Doctor",
  analogy:"Like a health inspector who checks every kitchen against the rulebook — instead of waiting for someone to get sick.",
  result:`<span class="num">133</span> real problems found across <span class="num">8</span> live lab repos — and <span class="num">3</span> came back completely clean.`,
  does:"It diagnoses each lab, and says plainly when a lab is actually fine. It doesn't cry wolf.",
  note:"The Doctor is a health inspector who checks every kitchen before anyone gets sick. Rocky read eight real repositories and found 133 genuine problems — and three came back perfectly clean. When a lab is fine, it says so."},

 {kind:"story", sec:"Find", prov:"REAL", e:"📄", hat:"Scanner",
  analogy:"Like a recipe translated into another language where the blank for 'your name here' was left as the literal words — so people type them in.",
  result:`In the Japanese guide, every login-detail slot was missing — so learners are told to type the placeholder <span class="num">“RTI_username”</span> as their username.`,
  does:"16 of these lost-in-translation credential problems found — the step just fails, and the learner has no idea why.",
  note:"The one that sticks. Our English guide auto-fills each learner's real login. In the Japanese translation those slots were dropped, so the learner is told to type 'RTI_username' word-for-word. Of course it fails. Rocky caught this plus 16 more — real, on a real course."},

 {kind:"story", sec:"Find", prov:"SIMULATED", e:"📡", hat:"Watcher",
  analogy:"Like a good security camera that doesn't blare every time the fridge hums — it alerts only when something changes, and tells you when it's over.",
  result:`A silent break was caught the moment it appeared, one outage folded into <span class="num">1</span> alert across <span class="num">4</span> labs, and recovery was detected on its own.`,
  does:"Shown on a safe practice timeline (a digital twin) — the detection logic is real; we prove it before pointing it at live data.",
  note:"The Watcher only beeps when something actually changes. Upfront: this timeline is a safe simulation so we prove the logic before live data. The recovery-detection is real; the timeline it ran on is the twin."},

 {kind:"stat", sec:"Find", prov:"REAL", big:"133", lbl:"real problems found in guides our learners use right now — verified, not guessed.",
  note:"If you remember one number, make it this. 133 real problems across eight repositories — verifiable on GitHub, not hypotheticals."},

 {kind:"section", sec:"Job 2", prov:"NONE", eyebrow:"Job 2 of 3", h1:"Fix",
  sub:"Repair it safely — a human always approves.",
  note:"Second job: fixing them, and doing it safely, so nothing changes without a person signing off."},

 {kind:"story", sec:"Fix", prov:"MIXED", e:"🛠️", hat:"Fixer",
  analogy:"Like a foreman who gets a hundred tickets and groups them by root cause, so one fix closes dozens at once.",
  result:`<span class="num">133</span> findings grouped into <span class="num">13</span> fix campaigns. <span class="num">5</span> real pull requests opened; <span class="num">2</span> already merged by a person.`,
  does:"The grouping view is from our practice environment; the pull requests on GitHub are completely real.",
  note:"A smart foreman with a job board. Instead of 133 random tickets, thirteen campaigns — the top three cover 62%. Five became real GitHub pull requests; two are already merged by a person."},

 {kind:"story", sec:"Fix", prov:"MIXED", e:"⚖️", hat:"Guardian",
  analogy:"Like an appeals court for a student wrongly failed by a glitchy grader — the verdict can be overturned, but only a named judge signs the order.",
  result:`It restores wrongly-failed learners — but with no human name attached, it <span class="num">refuses</span> outright, returning an error rather than quietly change a grade.`,
  does:"Only after 5 strict checks and a named person authorizing it. In review, 8 learners qualified and 2 were correctly turned down.",
  note:"An appeals court. Sometimes a learner failed because the lab was broken, not them. Rocky can restore results — but only after five checks and a named sign-off. Try it with no name: it refuses outright. That refusal is real; we demo it live."},

 {kind:"twoup", sec:"Fix", prov:"REAL",
  stats:[["4 sec","to automatically block a planted bug from ever merging back in"],
         ["0 / 42","false alarms in a hand-audited sample of Rocky's findings"]],
  note:"Two proofs. We planted a bug in a real repo — the safety gate blocked it in four seconds. And we hand-checked 42 findings: zero false alarms. When Rocky flags something, trust it."},

 {kind:"section", sec:"Job 3", prov:"NONE", eyebrow:"Job 3 of 3", h1:"Help",
  sub:"Stand beside the learner in the moment.",
  note:"Third job: helping the learner right when they're stuck, and helping support cut through the noise."},

 {kind:"story", sec:"Help", prov:"SIMULATED", e:"🎧", hat:"Listener",
  analogy:"Like a complaints desk buried under tickets that are really the same few problems, described a hundred ways.",
  result:`<span class="num">74</span> support tickets collapsed into <span class="num">24</span> real incidents — so the team fixes causes, not symptoms.`,
  does:"Roughly a 3-to-1 cut in the noise. Shown on simulated tickets for now.",
  note:"A smart complaints desk. Support drowns in tickets that are secretly the same problem. Rocky groups them so the team fixes the cause once instead of answering 74 times."},

 {kind:"story", sec:"Help", prov:"SIMULATED", e:"💬", hat:"Companion",
  analogy:"Like a waiter who won't let you order the dish that'll make you sick — Priya, stuck at 2 a.m., is about to try the tempting wrong fix.",
  result:`Rocky refuses the shortcut and names the real cause — the wrong region. When it can't verify, it says <span class="num">“I don't know”</span> rather than guess.`,
  does:"The live chat voice is off today (new model pending), so it answers with a plain evidence card — by design, it degrades gracefully instead of bluffing.",
  note:"The Companion sits with the learner. The obvious guess — 'pick a smaller machine' — is wrong and wastes an hour. Rocky refuses it and points to the real cause: wrong region. And if unsure, it says 'I don't know'. The chat voice is off today; it shows an evidence card instead."},

 {kind:"rs", sec:"Honesty", prov:"MIXED", h1:"What's real today — and what's a safe practice run",
  real:["133 defects · 8 repositories","5 pull requests (2 merged)","4-second safety gate; 0-in-42 false alarms","Live end-of-life forecasts"],
  sim:["The live fleet dashboard","Support & appeals numbers","The 2 a.m. Priya story","(A digital twin — proves the logic without touching real learners)"],
  note:"Completely straight about what's real: the problems, repos, pull requests, gate, forecasts — all verifiable. The dashboard, support and appeals figures, and Priya's story are a labeled twin. Our rule: the engine states facts, the AI narrates, and we never fake a green checkmark."},

 {kind:"closing", sec:"", prov:"NONE", logo:"🤖", h1:"We never fake green.",
  sub:"Rocky finds what's broken, fixes it with a human's approval, and helps the learner in the meantime.",
  note:"Rocky in one line: the reliability layer for our labs. It finds, fixes with a human's sign-off, and helps — and earns trust the hard way. The engine asserts, the AI narrates. Thank you."},
];

const wrap=document.getElementById('wrap'), bar=document.getElementById('bar'), noteEl=document.getElementById('note');
function railHead(s){return `<div class="head"><span class="mark">Rocky<span>.</span></span><span class="sec">${s.sec||''}</span></div>`;}
function railFoot(s,i){return `<div class="foot"><span class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span><span class="chip ${s.prov}">${s.prov==='NONE'?'':s.prov}</span></div>`;}
function bodyHtml(s){
  if(s.kind==='title'||s.kind==='closing') return `<div class="body">${s.logo?`<div class="logo">${s.logo}</div>`:''}${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h1>${s.h1}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>`;
  if(s.kind==='section') return `<div class="body"><div class="eyebrow">${s.eyebrow||''}</div><h1>${s.h1}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>`;
  if(s.kind==='jobs') return `<div class="body"><h1 style="font-size:44px;margin-bottom:26px">${s.h1}</h1><div class="jobs">${s.jobs.map(j=>`<div class="job"><div class="w">${j[0]}</div><h3>${j[0]}</h3><p>${j[1]}</p></div>`).join('')}</div></div>`;
  if(s.kind==='content') return `<div class="body"><h1>${s.h1}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>`;
  if(s.kind==='story') return `<div class="body"><div class="hat"><span class="e">${s.e}</span><span class="n">${s.hat}</span></div><div class="analogy">${s.analogy}</div><div class="result">${s.result}</div><div class="does">${s.does}</div></div>`;
  if(s.kind==='stat') return `<div class="body"><div class="big">${s.big}</div><div class="lbl">${s.lbl}</div></div>`;
  if(s.kind==='twoup') return `<div class="body"><div class="twoup">${s.stats.map(t=>`<div><div class="big">${t[0]}</div><div class="lbl">${t[1]}</div></div>`).join('')}</div></div>`;
  if(s.kind==='rs') return `<div class="body"><h1 style="font-size:40px;margin-bottom:22px">${s.h1}</h1><div class="rs"><div class="col real"><h3>Real today</h3><ul>${s.real.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="col sim"><h3>Simulated (labeled)</h3><ul>${s.sim.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`;
  return '<div class="body"></div>';
}
wrap.innerHTML=S.map((s,i)=>`<section class="slide center-${(s.kind==='title'||s.kind==='section'||s.kind==='closing')?'y':'n'} ${s.kind} ${(s.kind==='title'||s.kind==='section'||s.kind==='closing')?'center':''}">${railHead(s)}${bodyHtml(s)}${railFoot(s,i)}</section>`).join('');
const slides=[...wrap.children];
let cur=0;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.documentElement.style.setProperty('--s',s);}
addEventListener('resize',fit);fit();
const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===cur));
  bar.style.width=((cur+1)/S.length*100)+'%';
  prevBtn.disabled=(cur===0); nextBtn.disabled=(cur===S.length-1);
  if(noteEl.classList.contains('on'))noteEl.innerHTML=`<span class="k">Say this</span>${S[cur].note||''}`;}
prevBtn.addEventListener('click',(e)=>{e.stopPropagation();show(cur-1);});
nextBtn.addEventListener('click',(e)=>{e.stopPropagation();show(cur+1);});
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key)){show(cur+1);e.preventDefault();}
  else if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);
  else if(e.key==='Home')show(0); else if(e.key==='End')show(S.length-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key==='n'||e.key==='N'||e.key==='p'||e.key==='P'){noteEl.classList.toggle('on');if(noteEl.classList.contains('on'))noteEl.innerHTML=`<span class="k">Say this</span>${S[cur].note||''}`;}
});
addEventListener('click',e=>{if(e.target.closest('#note'))return;show(e.clientX>innerWidth*0.5?cur+1:cur-1);});
show(0);
</script>
</body>
</html>
